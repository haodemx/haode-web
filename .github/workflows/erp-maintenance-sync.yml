name: ERP Maintenance Sync

on:
  push:
    paths:
      - "data/maintenance/inbox/*.json"
  workflow_dispatch:
    inputs:
      sync_package_path:
        description: "Path to ERP sync package JSON in the repository"
        required: true
        default: "data/maintenance/inbox/sync-package.json"

permissions:
  contents: write

jobs:
  apply-sync-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve sync package
        id: sync-package
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            file="${{ inputs.sync_package_path }}"
          else
            file="$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" | grep '^data/maintenance/inbox/.*\\.json$' | head -1 || true)"
          fi
          if [ -z "${file}" ] || [ ! -f "${file}" ]; then
            echo "No sync package found" >&2
            exit 1
          fi
          echo "file=${file}" >> "$GITHUB_OUTPUT"

      - name: Apply ERP sync package
        run: npm run maintenance:erp-sync -- --file="${{ steps.sync-package.outputs.file }}" --apply

      - name: Run HAODE checks
        run: npm run build

      - name: Commit generated sync outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "haode-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/maintenance/erp-maintenance-sync.json data/marketing/erp-maintenance-tracking.json docs/reports/erp-maintenance-sync-report.md
          if git diff --cached --quiet; then
            echo "No generated sync output changed."
            exit 0
          fi
          git commit -m "Apply ERP maintenance sync package"
          git push origin "HEAD:${GITHUB_REF_NAME}"
