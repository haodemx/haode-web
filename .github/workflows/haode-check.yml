name: HAODE Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  haode-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies if needed
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ] && grep -q '"dependencies"\|"devDependencies"' package.json; then
            npm install
          else
            echo "No npm dependencies to install."
          fi

      - name: Run HAODE checks
        run: npm run haode:check

  critical-business-gate:
    needs: haode-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Website and App purchase paths
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/haode-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              sed -n '1,160p' /tmp/haode-http.log
              exit 1
            fi

            sleep 1
          done

          npx playwright test \
            tests/homepage-site-search.spec.js \
            tests/app-interaction-regressions.spec.js \
            tests/haode-app.spec.js \
            tests/homepage-whatsapp-tracking.spec.js \
            --workers=1
          npx playwright test tests/site-sales-shell-phase30.spec.js \
            --grep "404 gives catalog, category and WhatsApp recovery routes" \
            --workers=1

  package-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - haode-check
      - critical-business-gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare site artifact
        run: |
          mkdir _site
          git archive --format=tar HEAD | tar -x -C _site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package-pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  live-verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the deployed custom domain
        env:
          BASE_URL: https://haode.com.mx
        run: |
          for attempt in {1..6}; do
            if npm run verify:live \
              && npx playwright test tests/homepage-site-search.spec.js --workers=1; then
              exit 0
            fi

            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi

            echo "Live deployment is still propagating; retrying in 15 seconds."
            sleep 15
          done
