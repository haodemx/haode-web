name: HAODE Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  haode-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies if needed
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ] && grep -q '"dependencies"\|"devDependencies"' package.json; then
            npm install
          else
            echo "No npm dependencies to install."
          fi

      - name: Build and inspect the public package
        run: npm run build

  critical-business-gate:
    needs: haode-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the exact public artifact
        run: npm run build

      - name: Verify Website and App purchase paths
        run: |
          npx --yes --package=http-server@14.1.1 http-server _site -p 4173 -a 127.0.0.1 -c-1 -s > /tmp/haode-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              sed -n '1,160p' /tmp/haode-http.log
              exit 1
            fi

            sleep 1
          done

          BASE_URL=http://127.0.0.1:4173 npx playwright test \
            tests/homepage-site-search.spec.js \
            tests/app-interaction-regressions.spec.js \
            tests/haode-app.spec.js \
            tests/ga4-ecommerce-tracking.spec.js \
            tests/homepage-whatsapp-tracking.spec.js \
            --workers=1
          BASE_URL=http://127.0.0.1:4173 npx playwright test tests/site-sales-shell-phase30.spec.js \
            --grep "404 gives catalog, category and WhatsApp recovery routes" \
            --workers=1

          BASE_URL=http://127.0.0.1:4173 npm run browser-test

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: haode-browser-failure-${{ github.sha }}-${{ github.run_id }}
          path: test-results
          if-no-files-found: warn

      - name: Upload the browser-tested public artifact
        uses: actions/upload-artifact@v7
        with:
          name: haode-public-site-${{ github.sha }}
          path: _site
          include-hidden-files: true
          if-no-files-found: error

  verify-transferred-artifact:
    needs: critical-business-gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verifier
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download the browser-tested public artifact
        uses: actions/download-artifact@v8
        with:
          name: haode-public-site-${{ github.sha }}
          path: _site

      - name: Verify the transferred public artifact
        run: npm run verify:public-site

  package-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - verify-transferred-artifact
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verifier
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download the browser-tested public artifact
        uses: actions/download-artifact@v8
        with:
          name: haode-public-site-${{ github.sha }}
          path: _site

      - name: Verify the transferred public artifact
        run: npm run verify:public-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package-pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  live-verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the deployed custom domain
        env:
          BASE_URL: https://haode.com.mx
        run: |
          for attempt in {1..6}; do
            if npm run verify:live \
              && npx playwright test tests/homepage-site-search.spec.js --workers=1; then
              exit 0
            fi

            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi

            echo "Live deployment is still propagating; retrying in 15 seconds."
            sleep 15
          done
